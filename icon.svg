<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="redGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#dc2626" />
    </linearGradient>
    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#0066ff" />
    </linearGradient>
  </defs>

  <!-- Background Card -->
  <rect x="32" y="32" width="448" height="448" rx="96" fill="url(#bgGrad)" stroke="rgba(255,255,255,0.15)" stroke-width="6" />

  <!-- Outer Wi-Fi Wave -->
  <path d="M 128 200 A 180 180 0 0 1 384 200" fill="none" stroke="url(#blueGlow)" stroke-width="24" stroke-linecap="round" opacity="0.4" />
  
  <!-- Mid Wi-Fi Wave -->
  <path d="M 176 256 A 120 120 0 0 1 336 256" fill="none" stroke="url(#blueGlow)" stroke-width="24" stroke-linecap="round" />

  <!-- Inner Wi-Fi Wave -->
  <path d="M 224 312 A 60 60 0 0 1 288 312" fill="none" stroke="url(#redGlow)" stroke-width="24" stroke-linecap="round" />

  <!-- Center Node / Freebox Emblem Dot -->
  <circle cx="256" cy="360" r="24" fill="url(#redGlow)" />
</svg>
